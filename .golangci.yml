---
version: "2"

run:
  timeout: 4m

linters:
  enable:
    - errcheck
    - govet
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    staticcheck:
      # golangci-lint v2 merged gosimple into staticcheck. Keep running the
      # same checks as before (no quickfix or stylecheck checks).
      checks:
        - "S1*"
        - "SA*"

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          arguments:
            - allowedPackages:
                - "github.com/onsi/ginkgo"
                - "github.com/onsi/ginkgo/v2"
                - "github.com/onsi/gomega"
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        # Uncomment when all issues are fixed
        # - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    generated: lax
    paths:
      - temp
      - "(^|/)examples/"
    rules:
      - linters:
          - errcheck
        text: "Error return value of `(w.Write|fmt.Fprintf|fmt.Fprintln|file.Close|os.Setenv)` is not checked"
      # ECDH code needs to support a Go 1.21 toolchain
      - linters:
          - staticcheck
        text: "elliptic.+ has been deprecated since Go 1.21"

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - temp
      - "(^|/)examples/"
